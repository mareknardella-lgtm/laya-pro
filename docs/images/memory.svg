<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1220"/>
      <stop offset="100%" stop-color="#1b1030"/>
    </linearGradient>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a90b5"/>
    </marker>
  </defs>

  <rect width="960" height="330" rx="18" fill="url(#bg3)"/>
  <text x="40" y="48" fill="#ffffff" font-size="24" font-weight="700">Memoria</text>
  <text x="40" y="74" fill="#9aa0c4" font-size="14">SQLite locale · nessuna chiamata extra all'LLM nel percorso di retrieval</text>

  <rect x="40" y="110" width="200" height="82" rx="12" fill="#1c2140" stroke="#3b4272"/>
  <text x="140" y="144" fill="#e8ebff" font-size="14" font-weight="600" text-anchor="middle">Scambio riuscito</text>
  <text x="140" y="168" fill="#8a90b5" font-size="12" text-anchor="middle">prompt invisibile</text>

  <rect x="290" y="110" width="200" height="82" rx="12" fill="#1c2140" stroke="#3b4272"/>
  <text x="390" y="144" fill="#e8ebff" font-size="14" font-weight="600" text-anchor="middle">Estrazione</text>
  <text x="390" y="168" fill="#8a90b5" font-size="12" text-anchor="middle">"nome: Ada" → memoria</text>

  <rect x="540" y="110" width="200" height="82" rx="12" fill="#4d7a00"/>
  <text x="640" y="144" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">memory_entries</text>
  <text x="640" y="168" fill="#eaffd1" font-size="12" text-anchor="middle">key · value · pinned</text>

  <rect x="790" y="110" width="130" height="82" rx="12" fill="#1c2140" stroke="#3b4272"/>
  <text x="855" y="144" fill="#e8ebff" font-size="14" font-weight="600" text-anchor="middle">UI</text>
  <text x="855" y="168" fill="#8a90b5" font-size="12" text-anchor="middle">pannello</text>

  <line x1="240" y1="151" x2="282" y2="151" stroke="#8a90b5" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="490" y1="151" x2="532" y2="151" stroke="#8a90b5" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="740" y1="151" x2="782" y2="151" stroke="#8a90b5" stroke-width="2" marker-end="url(#a3)"/>

  <rect x="40" y="232" width="430" height="60" rx="12" fill="#1c2140" stroke="#3b4272"/>
  <text x="66" y="258" fill="#e8ebff" font-size="13" font-weight="600">Retrieval lessicale</text>
  <text x="66" y="278" fill="#8a90b5" font-size="12">solo le voci sopra la soglia di pertinenza finiscono nel prompt</text>

  <rect x="490" y="232" width="430" height="60" rx="12" fill="#4a2fd6"/>
  <text x="516" y="258" fill="#ffffff" font-size="13" font-weight="600">Voci pinnate</text>
  <text x="516" y="278" fill="#e6e0ff" font-size="12">inserite a mano: entrano sempre, anche senza parole in comune</text>

  <path d="M 640 192 C 640 215, 540 205, 540 228" fill="none" stroke="#8a90b5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a3)"/>
  <path d="M 240 262 C 300 305, 560 305, 660 296" fill="none" stroke="#8a90b5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a3)"/>
</svg>