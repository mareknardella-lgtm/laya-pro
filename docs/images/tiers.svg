<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1220"/>
      <stop offset="100%" stop-color="#1b1030"/>
    </linearGradient>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a90b5"/>
    </marker>
  </defs>

  <rect width="960" height="430" rx="18" fill="url(#bg)"/>
  <text x="40" y="48" fill="#ffffff" font-size="24" font-weight="700">Tre modalita', un solo contratto</text>
  <text x="40" y="74" fill="#9aa0c4" font-size="14">la modalita' dichiara quanto della pipeline puo' spendere</text>

  <!-- LOW -->
  <rect x="40" y="110" width="280" height="270" rx="14" fill="#1c2140" stroke="#3b4272"/>
  <text x="66" y="146" fill="#76b900" font-size="19" font-weight="700">LOW</text>
  <text x="66" y="170" fill="#9aa0c4" font-size="12">1 chiamata · il tier veloce da solo</text>
  <rect x="66" y="196" width="228" height="52" rx="10" fill="#2b3358"/>
  <text x="180" y="227" fill="#e8ebff" font-size="13" text-anchor="middle">messaggio + memoria + cronologia</text>
  <line x1="180" y1="248" x2="180" y2="272" stroke="#8a90b5" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="66" y="276" width="228" height="44" rx="10" fill="#4d7a00"/>
  <text x="180" y="303" fill="#ffffff" font-size="13" text-anchor="middle">Nemotron · risposta</text>
  <text x="66" y="352" fill="#7f86ad" font-size="11.5">quando la domanda e' gia' una domanda.</text>

  <!-- MEDIUM -->
  <rect x="340" y="110" width="280" height="270" rx="14" fill="#1c2140" stroke="#3b4272"/>
  <text x="366" y="146" fill="#7c5cff" font-size="19" font-weight="700">MEDIUM</text>
  <text x="366" y="170" fill="#9aa0c4" font-size="12">2 chiamate · prima il piano</text>
  <rect x="366" y="196" width="228" height="44" rx="10" fill="#2b3358"/>
  <text x="480" y="223" fill="#e8ebff" font-size="13" text-anchor="middle">messaggio utente</text>
  <line x1="480" y1="240" x2="480" y2="258" stroke="#8a90b5" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="366" y="262" width="228" height="40" rx="10" fill="#4a2fd6"/>
  <text x="480" y="287" fill="#ffffff" font-size="13" text-anchor="middle">laya-coreml · reason</text>
  <line x1="480" y1="302" x2="480" y2="318" stroke="#8a90b5" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="366" y="320" width="228" height="40" rx="10" fill="#4d7a00"/>
  <text x="480" y="345" fill="#ffffff" font-size="13" text-anchor="middle">Nemotron · genera</text>

  <!-- HARD -->
  <rect x="640" y="110" width="280" height="270" rx="14" fill="#1c2140" stroke="#3b4272"/>
  <text x="666" y="146" fill="#ff8a5c" font-size="19" font-weight="700">HARD</text>
  <text x="666" y="170" fill="#9aa0c4" font-size="12">3–5 chiamate · con revisione</text>
  <rect x="666" y="192" width="228" height="34" rx="9" fill="#2b3358"/>
  <text x="780" y="214" fill="#e8ebff" font-size="12" text-anchor="middle">messaggio utente</text>
  <line x1="780" y1="226" x2="780" y2="238" stroke="#8a90b5" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="666" y="240" width="228" height="34" rx="9" fill="#4a2fd6"/>
  <text x="780" y="262" fill="#ffffff" font-size="12" text-anchor="middle">laya-coreml · reason (deep)</text>
  <line x1="780" y1="274" x2="780" y2="286" stroke="#8a90b5" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="666" y="288" width="228" height="34" rx="9" fill="#4d7a00"/>
  <text x="780" y="310" fill="#ffffff" font-size="12" text-anchor="middle">Nemotron · bozza</text>
  <line x1="780" y1="322" x2="780" y2="334" stroke="#8a90b5" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="666" y="336" width="228" height="34" rx="9" fill="#4a2fd6"/>
  <text x="780" y="358" fill="#ffffff" font-size="12" text-anchor="middle">laya-coreml · critique → riscrivi</text>

  <text x="40" y="410" fill="#7f86ad" font-size="12">il ciclo di revisione e' limitato da LAYA_MAX_REFINEMENTS: a budget esaurito l'ultima bozza torna con status "degraded"</text>
</svg>