<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1220"/>
      <stop offset="100%" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="sys1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#4d7a00"/>
    </linearGradient>
    <linearGradient id="sys2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#4a2fd6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a90b5"/>
    </marker>
  </defs>

  <rect width="960" height="470" rx="18" fill="url(#bg)"/>

  <text x="40" y="52" fill="#ffffff" font-size="27" font-weight="700">Laya Pro</text>
  <text x="40" y="80" fill="#9aa0c4" font-size="15">un solo contratto, due motori con ruoli opposti</text>

  <!-- UI -->
  <rect x="40" y="130" width="170" height="86" rx="12" fill="#1c2140" stroke="#3b4272"/>
  <text x="125" y="166" fill="#e8ebff" font-size="15" font-weight="600" text-anchor="middle">Web UI</text>
  <text x="125" y="190" fill="#8a90b5" font-size="12" text-anchor="middle">chat · trace · memoria</text>

  <!-- API -->
  <rect x="40" y="256" width="170" height="86" rx="12" fill="#1c2140" stroke="#3b4272"/>
  <text x="125" y="292" fill="#e8ebff" font-size="15" font-weight="600" text-anchor="middle">FastAPI</text>
  <text x="125" y="316" fill="#8a90b5" font-size="12" text-anchor="middle">REST · errori espliciti</text>

  <!-- Orchestrator -->
  <rect x="272" y="192" width="212" height="104" rx="14" fill="#252b52" stroke="#5a63a8" stroke-width="2"/>
  <text x="378" y="234" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Orchestratore</text>
  <text x="378" y="258" fill="#9aa0c4" font-size="12" text-anchor="middle">LOW · MEDIUM · HARD</text>
  <text x="378" y="278" fill="#9aa0c4" font-size="12" text-anchor="middle">ciclo di revisione limitato</text>

  <!-- System 2 -->
  <rect x="560" y="112" width="230" height="104" rx="14" fill="url(#sys2)"/>
  <text x="675" y="146" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">System 2 · laya-coreml</text>
  <text x="675" y="170" fill="#e6e0ff" font-size="12" text-anchor="middle">reason → piano verificabile</text>
  <text x="675" y="190" fill="#e6e0ff" font-size="12" text-anchor="middle">critique → verdetto</text>

  <!-- System 1 -->
  <rect x="560" y="272" width="230" height="104" rx="14" fill="url(#sys1)"/>
  <text x="675" y="306" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">System 1 · Nemotron</text>
  <text x="675" y="330" fill="#eaffd1" font-size="12" text-anchor="middle">3.5 Lightning 30B A3B</text>
  <text x="675" y="350" fill="#eaffd1" font-size="12" text-anchor="middle">generate · refine</text>

  <!-- Memory -->
  <rect x="826" y="192" width="100" height="104" rx="12" fill="#1c2140" stroke="#3b4272"/>
  <text x="876" y="232" fill="#e8ebff" font-size="14" font-weight="600" text-anchor="middle">Memoria</text>
  <text x="876" y="254" fill="#8a90b5" font-size="11" text-anchor="middle">SQLite</text>
  <text x="876" y="272" fill="#8a90b5" font-size="11" text-anchor="middle">pin + retrieval</text>

  <line x1="210" y1="173" x2="266" y2="173" stroke="#8a90b5" stroke-width="2"/>
  <line x1="210" y1="299" x2="266" y2="299" stroke="#8a90b5" stroke-width="2"/>
  <line x1="210" y1="173" x2="210" y2="299" stroke="#8a90b5" stroke-width="2"/>

  <line x1="484" y1="226" x2="552" y2="180" stroke="#8a90b5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="484" y1="262" x2="552" y2="312" stroke="#8a90b5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="164" x2="826" y2="228" stroke="#8a90b5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="790" y1="324" x2="826" y2="260" stroke="#8a90b5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="378" y1="296" x2="378" y2="352" stroke="#5a63a8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="378" y="372" fill="#7f86ad" font-size="11" text-anchor="middle">trace: engine + latenza per ogni hop</text>

  <text x="40" y="432" fill="#7f86ad" font-size="12">il ragionamento è fail-closed: nessun piano valido → 503, mai una risposta inventata</text>
</svg>