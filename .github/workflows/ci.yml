name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: |
          pytest backend/tests/ -q

      - name: Launcher smoke test
        # run.py is the documented entry point: it must work from any directory,
        # which is exactly the regression that once shipped a broken file.
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/run.py" --help
